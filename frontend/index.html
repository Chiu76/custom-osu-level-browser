<!doctype html>
<html lang="en-US">
<head>
<link rel="shortcut icon" href="#">
<link href="css/styles.css" rel="stylesheet" type="text/css" />
<script src="./vendor/virtualized-list/virtualized-list.js"></script>
<script src="./index.js" type="module"></script>
</head>
<body>
    <main class="app-layout">
        <div class="settings">
            <h2>Settings</h2>
            <div class="score-settings">
                <div id="score-top-by">
                    <span>Score top by: </span>
                    <select></select>
                    <span class="dir"></span>
                </div>
                <div id="mods-exact-filter">
                    <span>Mods exact: </span>
                    <input
                        placeholder="Filter for exact mods.."
                    />
                </div>
                <div id="mods-include-filter">
                    <span>Mods include: </span>
                    <input
                        placeholder="Filter for included mods.."
                    />
                </div>
                <div id="mods-exclude-filter">
                    <span>Mods exclude: </span>
                    <input
                        placeholder="Filter for excluded mods.."
                    />
                </div>
                <div id="score-required">
                    <span> Show only beatmaps with scores: </span>
                    <input type="checkbox">
                </div>
            </div>
            <div class="beatmap-query-settings">
                <div class="sort-selects">
                    <span>Sort by: </span>
                    <span id="sort-primary">
                        <select></select>
                        <span class="dir"></span>
                    </span>
                    <span id="sort-secondary">
                        <select></select>
                        <span class="dir"></span>
                    </span>
                    <span id="sort-third">
                        <select></select>
                        <span class="dir"></span>
                    </span>
                </div>
                <div id="beatmap-filter">
                    <span>Filters: </span>
                    <input
                        placeholder="Filter beatmaps.."
                    />
                </div>
                <div id="beatmap-search">
                    <span>Search: </span>
                    <input
                        placeholder="Search beatmaps.."
                    />
                </div>
                <div id="disable-beatmap-sets">
                    <span> Disable grouping into beatmaps sets: </span>
                    <input type="checkbox">
                </div>
            </div>
            <div class="grouping-settings">
                <div>
                    <div>
                        <span>Selected source: </span>
                        <span id="active-source">(none)</span>
                        <button type="button" onload="" onclick="clearActiveSource()">Clear</button>
                    </div>
                    <div>
                        <span>Selected grouping: </span>
                        <span id="active-grouping">(none)</span>
                        <button type="button" onclick="clearActiveGrouping()">Clear</button>
                    </div>
                </div>
                <div>
                    <span id="grouping-search">
                        <input
                            placeholder="Search groupings.."
                        />
                    </span>
                    <span id="grouping-type">
                        <select></select>
                        <!-- <div class="dir"></div> -->
                    </span>
                </div>
            </div>
        </div>
        <div class="scores">
            <h2>Scores</h2>
            <ul class="list" id="score-list-container"></ul>
        </div>
        <div class="beatmaps">
            <h2>Beatmaps</h2>
            <ul class="list" id="beatmap-list-container"></ul>
        </div>
        <div class="groupings">
            <h2>Groupings</h2>
            <ul class="list" id="grouping-list-container"></ul>
        </div>
    </main>
</body>
</html>
